spring.application.name=amul-notifier

# Load DB settings from the root .env (KEY=value is valid properties syntax).
# optional: = no crash if absent; real env vars take precedence (CI/prod).
spring.config.import=optional:file:../.env[.properties]

# Connection: host/port default to local Docker; db/user/password come from .env.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway owns the schema; Hibernate only checks entities match it.
spring.jpa.hibernate.ddl-auto=validate

# Close DB sessions when the service layer finishes, not after the HTTP response is written.
# Avoids hidden queries from controllers/JSON serialization.
spring.jpa.open-in-view=false
